name: Release

# Push a tag like v0.1.0 to build the Windows installer and attach it to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - name: Check the update files are there (the in-app updater needs them)
        shell: bash
        run: |
          test -f dist/win-unpacked/resources/app-update.yml
          grep -q "owner: AxialForge" dist/win-unpacked/resources/app-update.yml
          grep -q "repo: SheetTracker" dist/win-unpacked/resources/app-update.yml
          test -f dist/latest.yml
          grep -q "^version: $(node -p "require('./package.json').version")$" dist/latest.yml
          ls dist/*.blockmap
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*-setup.exe
            dist/latest.yml
            dist/*.blockmap

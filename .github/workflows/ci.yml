name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm ci
      - run: npm test
      - name: Headless smoke run (every tab, every theme)
        run: npm run screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: docs/screenshots }

  build-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: setup-tracker-windows
          path: |
            dist/*-setup.exe
            dist/latest.yml
            dist/*.blockmap

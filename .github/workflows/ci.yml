name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm ci
      - run: npm test
      - name: Headless smoke run (every tab, every theme)
        run: npm run screenshots
      - name: Sheet scanning end to end (PDF text layer, scanned PDF, photo, entry fill, folder import)
        run: npm run ocr-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: docs/screenshots }

  build-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - name: Check the update files are there (the in-app updater needs them)
        shell: bash
        run: |
          test -f dist/win-unpacked/resources/app-update.yml
          grep -q "owner: AxialForge" dist/win-unpacked/resources/app-update.yml
          grep -q "repo: SheetTracker" dist/win-unpacked/resources/app-update.yml
          test -f dist/latest.yml
          V=$(node -p "require('./package.json').version")
          grep -q "^version: $V$" dist/latest.yml
          # the updater asks GitHub for exactly this file name (spaces would be rewritten and 404)
          test -f "dist/Setup-Tracker-$V-setup.exe"
          grep -q "path: Setup-Tracker-$V-setup.exe" dist/latest.yml
          ls dist/*.blockmap
      - name: Check the OCR files are outside app.asar (the OCR worker loads them from disk)
        shell: bash
        run: |
          U=dist/win-unpacked/resources/app.asar.unpacked/node_modules
          test -f $U/tesseract.js/src/worker-script/node/index.js
          test -f $U/tesseract.js-core/tesseract-core-simd-lstm.wasm
          test -f $U/tesseract.js-core/tesseract-core-lstm.wasm
          test -f $U/@tesseract.js-data/eng/4.0.0_best_int/eng.traineddata.gz
          test -f $U/wasm-feature-detect/package.json
      - name: Sheet scanning from the packaged app (does not block the build)
        continue-on-error: true
        shell: bash
        run: |
          export OCR_SMOKE_ASAR="$PWD/dist/win-unpacked/resources/app.asar" OCR_SMOKE_OUT="$RUNNER_TEMP/shots" OCR_SMOKE_LOG="$RUNNER_TEMP/ocr-smoke.log"
          mkdir -p "$OCR_SMOKE_OUT"
          timeout 600 node_modules/electron/dist/electron.exe scripts/ocr-smoke.js || true
          cat "$OCR_SMOKE_LOG"
          grep -q "OCR SMOKE OK" "$OCR_SMOKE_LOG"
      - uses: actions/upload-artifact@v4
        with:
          name: setup-tracker-windows
          path: |
            dist/*-setup.exe
            dist/latest.yml
            dist/*.blockmap

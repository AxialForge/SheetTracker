name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm ci
      - run: npm test
      - name: Headless smoke run (every tab, every theme)
        run: npm run screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: docs/screenshots }

  build-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - name: Check the update files are there (the in-app updater needs them)
        shell: bash
        run: |
          test -f dist/win-unpacked/resources/app-update.yml
          grep -q "owner: AxialForge" dist/win-unpacked/resources/app-update.yml
          grep -q "repo: SheetTracker" dist/win-unpacked/resources/app-update.yml
          test -f dist/latest.yml
          V=$(node -p "require('./package.json').version")
          grep -q "^version: $V$" dist/latest.yml
          # the updater asks GitHub for exactly this file name (spaces would be rewritten and 404)
          test -f "dist/Setup-Tracker-$V-setup.exe"
          grep -q "path: Setup-Tracker-$V-setup.exe" dist/latest.yml
          ls dist/*.blockmap
      - uses: actions/upload-artifact@v4
        with:
          name: setup-tracker-windows
          path: |
            dist/*-setup.exe
            dist/latest.yml
            dist/*.blockmap
